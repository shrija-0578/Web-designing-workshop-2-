<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Content Changer</title>
    <link rel="stylesheet" href="css6.css">
</head>
<body>
    <div id="content">
        <h1 id="heading"> welcome to JavaScript lab</h1>
        <input type="text" id="inputfield" placeholder="Enter new heading text here">
        <br><br>
        <button id="changeheading">Change Heading</button>
        <button id="background">Change Background Color</button>
        <button id="fontsize">increase Font Size</button>
        <button id="toggleParagraph">show/hide Paragraph</button>   
        <button id="reset">Reset</button>

        <p id="paragraph">This is a simple webpage to demonstrate dynamic content changing using JavaScript.</p>
    </div>
    
</body>
</html>
