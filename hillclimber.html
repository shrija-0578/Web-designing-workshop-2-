<!DOCTYPE html>
<html>
<head>
    <title>Simple Hill Climbing</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-image: url(b2.jpg);
            background-size: cover;
        }
        .hill-container {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 120%;
            overflow: hidden; /* Hide the hill when it's "off-screen" */
        }

        .hill {
            background-image: url(hill.png);
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            background-size: cover;
            animation: moveHill 25s linear infinite;
        }

        /* Offset the second hill so it starts right behind the first one */
        .hill2 {
            left: 100%;
        }

        @keyframes moveHill {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }


        .car {
            position: absolute;
            bottom: 12%;
            left: 10%;
            width: 60px;
            height: 30px;
            background: red;
            border-radius: 5px;
            animation: bounce 25s ease-in-out infinite;
            z-index: 4;
        }


        .wheel_left { 
            position: absolute;
            bottom: -10px;
            width: 15px;
            height: 15px;
            background: black;
            border-radius: 50%;
            left: 5px; }
        .wheel_right { 
            position: absolute;
            bottom: -10px;
            width: 15px;
            height: 15px;
            background: black;
            border-radius: 50%;
            right: 5px; }

         @keyframes bounce {
            /* 0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); } */
                /* 0% { transform: translateY(0); }
                15% { transform: translateY(-40px); }
                35% { transform: translateY(-260px); }
                40% { transform: translateY(-260px); }
                55% { transform: translateY(-60px); }
                65% { transform: translateY(-240px); } 
                70% { transform: translateY(-50px); }
                80% { transform: translateY(-40); }
                /* 100% { transform: translateY(0); }  */
                10% { transform: translateY(-40px); }
                20% { transform: translateY(-70px); }
                30% { transform: translateY(-250px); }
                    40% { transform: translateY(-290px); }
                53% { transform: translateY(-100px); }
                60% { transform: translateY(-70px); }
                65% { transform: translateY(-30px); }
                70% { transform: translateY(-20px); }
                80% { transform: translateY(-5px); }
                90% { transform: translateY(+5px); }    
                 100% { transform: translateY(0); }
        }

        h2 {
             position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 5px black;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            z-index: 2;
        }

        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background: #64d8ea;
            border: solid 4px #12a0e7;
            box-shadow: 0 4px #12a0e7;
            color: white;
            cursor: pointer;
        }
        .btn:hover {
            background: #12a0e7;
            box-shadow: 0 2px #12a0e7;
            transform: translateY(2px);
        }
        .btn:active {
            transform: scale(0.95);
        }
        .score-board {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 1.5rem;
            color: white;
        }


    </style>
</head>
<body>

    <div class="score-board">
        Score: 0
    </div>

    <h2>Hill Climbing Racing</h2>

    <div class="car">
        <div class="wheel_left"></div>
        <div class="wheel_right"></div>
    </div>
    <div class="hill-container">
    <div class="hill"></div>
    <div class="hill hill2"></div>
    </div>

    <div class="controls">
        <button class="btn">Accelerate</button>
        <button class="btn">Brake</button>
    </div>
     



</body>
</html>
