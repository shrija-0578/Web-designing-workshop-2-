<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" 
content="width=device-width, initial-scale=1.0">

<title>Employee Details</title>

<link rel="stylesheet" href="index.css">
<script src="index.js"></script>

</head>

<body>

<div id="container">

<h1>Employee Details</h1>

<div class="form-group">
<label for="name">Name:</label>
<input type="text" id="name" placeholder="Enter employee name">
</div>

<div class="form-group">
<label for="empid">Employee ID:</label>
<input type="text" id="empid" placeholder="Enter employee ID">
</div>

<div class="form-group">
<label for="empsal">Employee Salary:</label>
<input type="number" id="empsal" placeholder="Enter employee salary">
</div>

<div class="form-group">
<label for="department">Department:</label>
<input type="text" id="department" placeholder="Enter employee department">
</div>

<div class="button-group">
<button onclick="addEmployee()">Add Employee</button>
<button onclick="displayEmployees()">Display Employees</button>
<button onclick="totalSalary()">Total Salary</button>
<button onclick="averageSalary()">Average Salary</button>
<button onclick="countDepartment()">Count by Department</button>
</div>

<p id="output"></p>

</div>

</body>
</html>
