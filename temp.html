<!DOCTYPE html>
<html>
<head>
    <title>Hill Climber Racing</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* GAME CONTAINER */
        .game {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to top, #87CEEB, #cceeff);
        }

        /* TITLE */
        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 2.5rem;
            color: white;
            text-shadow: 2px 2px 5px black;
        }

        /* SCORE DISPLAY (for future JS use) */
        .score-board {
            position: absolute;
            top: 80px;
            left: 20px;
            font-size: 1.5rem;
            color: white;
        }

        /* HILL (GROUND) */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 40%;
            background: #2e8b57;
            border-radius: 50% 50% 0 0;
        }

        /* CAR CONTAINER */
        .car {
            position: absolute;
            bottom: 35%;
            left: 15%;
            width: 100px;
            height: 40px;
            background: red;
            border-radius: 8px;
        }

        .car::before {
            content: "";
            position: absolute;
            top: -20px;
            left: 20px;
            width: 60px;
            height: 20px;
            background: darkred;
            border-radius: 8px 8px 0 0;
        }

        /* WHEELS */
        .wheel {
            position: absolute;
            bottom: -15px;
            width: 25px;
            height: 25px;
            background: black;
            border-radius: 50%;
        }

        .wheel.left {
            left: 10px;
        }

        .wheel.right {
            right: 10px;
        }

        /* CONTROLS (For Future JS Use) */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
        }

        .btn {
            padding: 10px 20px;
            margin: 10px;
            font-size: 1.2rem;
            border: none;
            border-radius: 8px;
            background: #0AC4E0;
            color: white;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.95);
        }

    </style>
</head>

<body>

<div class="game">

    <div class="title">Hill Climber Racing</div>

    <div class="score-board">
        Score: 0
    </div>

    <!-- Ground -->
    <div class="ground"></div>

    <!-- Car -->
    <div class="car">
        <div class="wheel left"></div>
        <div class="wheel right"></div>
    </div>

    <!-- Buttons (for JS later) -->
    <div class="controls">
        <button class="btn">Accelerate</button>
        <button class="btn">Brake</button>
    </div>

</div>

</body>
</html>
